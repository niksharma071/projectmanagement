name: CD - Deploy to AWS

on:
  push:
    branches: [ "main" ] # This triggers ONLY when code is merged or pushed to main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Gets your code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Logs into Docker Hub using your safely stored secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Sets up the advanced Docker builder tool
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Actually builds the image and pushes it to your registry
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Automatically tags the image with your username so Docker Hub accepts it
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend_docker:latest

  deploy-to-server:
    needs: build-and-push # Ensures this job waits for the image to be fully pushed
    runs-on: ubuntu-latest
    steps:
      - name: Connect to AWS and Deploy
        # We use a pre-built GitHub Action specifically for SSH connections
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_IP }}      
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}      
          script: |
            # Navigate to the folder containing your .env file
            cd ~/projectmanagement
            
            # 1. Log in to Docker Hub on the EC2 server
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # 2. Pull the newly built private image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend_docker:latest
            
            # 3. Stop and remove the old container (|| true prevents crash if it doesn't exist yet)
            docker rm -f my_running_api || true
            
            # 4. Run the new container with automatic restarts and the local .env file
            docker run -d --restart=always -p 8080:8080 --env-file .env --name my_running_api ${{ secrets.DOCKERHUB_USERNAME }}/backend_docker:latest